<!-- ═════════ ONBOARDING ═════════ -->
<section id="onboard" aria-labelledby="onb-title" hidden>
  <div class="onb-card">
    <svg class="onb-mascot" aria-hidden="true"><use href="#m-happy"/></svg>
    <h1 id="onb-title">Метеощоденник</h1>
    <p class="onb-sub" id="onb-sub"></p>

    <div class="onb-step" data-step="0">
      <h2 data-i18n="onb.nameTitle"></h2>
      <div class="field">
        <label for="onb-name" data-i18n="onb.nameLabel"></label>
        <input type="text" id="onb-name" maxlength="40" autocomplete="off" autocapitalize="words" enterkeyhint="next">
        <p class="hint" data-i18n="onb.nameHint"></p>
        <p class="err" id="onb-name-err" role="alert" hidden data-i18n="onb.needName"></p>
      </div>
      <div class="field">
        <label for="onb-class" data-i18n="onb.classLabel"></label>
        <input type="text" id="onb-class" maxlength="10" autocomplete="off" enterkeyhint="next">
      </div>
      <div class="field">
        <span class="label" id="onb-lang-lbl" data-i18n="onb.langTitle"></span>
        <div class="lang-grid" id="onb-langs" role="group" aria-labelledby="onb-lang-lbl"></div>
      </div>
    </div>

    <div class="onb-step" data-step="1">
      <h2 data-i18n="onb.avatarTitle"></h2>
      <p class="hint" data-i18n="onb.avatarHint"></p>
      <div class="avatar-grid" id="onb-avatars" role="group" data-i18n-attr="aria-label:onb.avatarTitle"></div>
    </div>

    <div class="onb-step" data-step="2">
      <h2 data-i18n="onb.cityTitle"></h2>
      <p class="hint" data-i18n="onb.cityHint"></p>
      <div class="field">
        <label for="onb-city" data-i18n="onb.cityLabel"></label>
        <div class="row">
          <input type="search" id="onb-city" autocomplete="off" enterkeyhint="search">
          <button type="button" class="btn btn-primary" id="onb-city-search"><svg class="ic" aria-hidden="true"><use href="#u-search"/></svg><span data-i18n="place.search"></span></button>
        </div>
      </div>
      <p class="hint" id="onb-city-status" role="status"></p>
      <ul class="results" id="onb-city-results"></ul>
      <button type="button" class="btn btn-sm" id="onb-geo"><svg class="ic" aria-hidden="true"><use href="#u-pin"/></svg><span data-i18n="place.geo"></span></button>
      <p class="note" data-i18n="place.privacy"></p>
      <button type="button" class="btn btn-ghost btn-sm" id="onb-skip" data-i18n="onb.skip"></button>
    </div>

    <div class="onb-foot">
      <button type="button" class="btn" id="onb-back" hidden><svg class="ic flip" aria-hidden="true"><use href="#u-left"/></svg><span data-i18n="onb.back"></span></button>
      <button type="button" class="btn btn-primary btn-lg" id="onb-next"><span id="onb-next-t" data-i18n="onb.next"></span><svg class="ic flip" aria-hidden="true"><use href="#u-right"/></svg></button>
    </div>
    <div class="onb-dots" id="onb-dots" aria-hidden="true"></div>
  </div>
</section>

      <div class="pg-item"><svg class="ic ic-flame" aria-hidden="true"><use href="#u-flame"/></svg><div><strong id="pg-streak">0</strong><small data-i18n="game.streak"></small></div></div>
    </section>

    <section class="cal-card" aria-labelledby="month-title">
      <div class="cal-head">

      </div>
      <div class="cal-wrap">

    <div class="actions">

      <button type="button" class="btn" id="btn-export"><svg class="ic" aria-hidden="true"><use href="#u-save"/></svg><span data-i18n="act.export"></span></button>
      <button type="button" class="btn" id="btn-import"><svg class="ic" aria-hidden="true"><use href="#u-open"/></svg><span data-i18n="act.import"></span></button>
      <input type="file" id="file-import" accept=".weather,.json,application/json" multiple hidden>
      <button type="button" class="btn" id="btn-print"><svg class="ic" aria-hidden="true"><use href="#u-print"/></svg><span data-i18n="act.print"></span></button>
      <button type="button" class="btn" id="btn-class"><svg class="ic" aria-hidden="true"><use href="#u-class"/></svg><span data-i18n="act.class"></span></button>
    </div>

    <div class="two">
      <div class="stack">
        <section class="card chart-card" aria-labelledby="chart-title">
          <h2 id="chart-title" data-i18n="chart.title"></h2>
          <div id="chart" dir="ltr"></div>
          <p class="chart-empty" id="chart-empty" data-i18n="chart.empty"></p>
          <ul class="chart-legend" id="chart-legend"></ul>
          <details class="data-details">
            <summary data-i18n="chart.table"></summary>
            <div id="chart-table" class="table-wrap"></div>
          </details>
        </section>

        <section class="card sticker-card only-kid" aria-labelledby="stickers-title">
          <h2 id="stickers-title" data-i18n="stickers.title"></h2>
          <ul class="stickers" id="stickers"></ul>
          <p class="note" id="stickers-hint"></p>
        </section>

        <section class="card badges-card" aria-labelledby="badges-title">
          <h2 id="badges-title" data-i18n="badges.title"></h2>
          <ul class="badges" id="badges"></ul>
          <p class="note" id="badges-next"></p>
        </section>
      </div>

      <aside class="stack">
        <section class="card stats-card" aria-labelledby="stats-title">
          <h2 id="stats-title" data-i18n="stats.title"></h2>
          <div id="stats"></div>
        </section>
        <section class="card rose-card" aria-labelledby="rose-title">
          <h2 id="rose-title" data-i18n="rose.title"></h2>
          <div id="rose" dir="ltr"></div>
          <p class="note center" id="rose-hint"></p>
        </section>
      </aside>
    </div>
  </main>

  <footer class="foot">
    <p id="foot-text"></p>
    <p class="foot-author" data-i18n="app.author"></p>
    <p><button type="button" class="btn btn-sm btn-ghost" id="btn-privacy"><svg class="ic" aria-hidden="true"><use href="#u-shield"/></svg><span data-i18n="privacy.open"></span></button></p>
  </footer>
</div>

<!-- ═════════ DAY DIALOG ═════════ -->
<dialog id="dlg-day" aria-labelledby="day-title">
  <form id="day-form" novalidate>
    <div class="dlg-head">
      <h2 class="dlg-title" id="day-title">—</h2>
      <button type="button" class="btn btn-icon btn-ghost" data-close data-i18n-attr="aria-label:ui.close"><svg class="ic" aria-hidden="true"><use href="#u-close"/></svg></button>
    </div>
    <div class="dlg-body">

      <fieldset class="field" id="fld-sky">
        <legend data-i18n="day.sky"></legend>
        <div class="tiles tiles-sky" id="sky-chips" role="group" data-i18n-attr="aria-label:day.sky"></div>
        <p class="err" id="err-sky" role="alert" hidden data-i18n="day.needSky"></p>
      </fieldset>

      <fieldset class="field" id="fld-temp">
        <legend data-i18n="day.temp"></legend>
        <div class="temp-widget">
          <div id="thermo-wrap"></div>
          <div class="temp-side">
            <div id="temp-stepper"></div>
            <p class="hint" data-i18n="day.tempHint"></p>
          </div>
        </div>
        <p class="err" id="err-temp" role="alert" hidden data-i18n="day.needTemp"></p>
      </fieldset>

      <fieldset class="field" id="fld-wind">
        <legend data-i18n="day.wind"></legend>
        <div class="tiles tiles-wind only-kid" id="wind-steps" role="group" data-i18n-attr="aria-label:day.wind"></div>
        <div class="only-adult" id="wind-stepper"></div>
      </fieldset>

      <fieldset class="field" id="fld-dir">
        <legend data-i18n="day.dir"></legend>
        <div class="compass" id="dir-compass" role="group" data-i18n-attr="aria-label:day.dir"></div>
      </fieldset>

      <fieldset class="field" id="fld-mood">
        <legend data-i18n="day.mood"></legend>
        <div class="tiles tiles-mood" id="mood-chips" role="group" data-i18n-attr="aria-label:day.mood"></div>
      </fieldset>

      <details class="more" id="more-box">
        <summary data-i18n="day.more"></summary>
        <fieldset class="field" id="fld-hum">
          <legend data-i18n="day.hum"></legend>
          <div class="tiles tiles-hum only-kid" id="hum-steps" role="group" data-i18n-attr="aria-label:day.hum"></div>
          <div class="only-adult" id="hum-stepper"></div>
        </fieldset>
        <fieldset class="field" id="fld-time">
          <legend data-i18n="day.time"></legend>
          <div id="time-stepper"></div>
          <p class="hint" data-i18n="day.timeHint"></p>
        </fieldset>
        <div class="field">
          <label for="f-notes" data-i18n="day.notes"></label>
          <textarea id="f-notes" maxlength="500" rows="2"></textarea>
          <p class="hint" data-i18n="day.notesHint"></p>
        </div>
      </details>

      <div class="real-box" id="real-box" hidden>
        <h3 data-i18n="real.title"></h3>
        <div id="real-table" class="table-wrap"></div>
        <p class="note" data-i18n="real.note"></p>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-danger" id="btn-day-delete"><svg class="ic" aria-hidden="true"><use href="#u-trash"/></svg><span data-i18n="day.delete"></span></button>
      <div class="spacer"></div>
      <button type="button" class="btn" data-close data-i18n="ui.cancel"></button>
      <button type="submit" class="btn btn-primary btn-lg"><svg class="ic" aria-hidden="true"><use href="#u-check"/></svg><span data-i18n="day.save"></span></button>
    </div>
  </form>
</dialog>

<!-- ═════════ PREDICT DIALOG ═════════ -->
<dialog id="dlg-predict" aria-labelledby="predict-title">
  <form id="predict-form" novalidate>
    <div class="dlg-head">
      <svg class="dlg-mascot" aria-hidden="true"><use href="#m-think"/></svg>
      <h2 class="dlg-title" id="predict-title" data-i18n="game.title"></h2>
      <button type="button" class="btn btn-icon btn-ghost" data-close data-i18n-attr="aria-label:ui.close"><svg class="ic" aria-hidden="true"><use href="#u-close"/></svg></button>
    </div>
    <div class="dlg-body">
      <p class="hint" data-i18n="game.intro"></p>
      <fieldset class="field">
        <legend data-i18n="game.skyQ"></legend>
        <div class="tiles tiles-sky" id="pred-sky" role="group" data-i18n-attr="aria-label:game.skyQ"></div>
      </fieldset>
      <fieldset class="field">
        <legend data-i18n="game.trendQ"></legend>
        <div class="tiles tiles-trend" id="pred-trend" role="group" data-i18n-attr="aria-label:game.trendQ"></div>
      </fieldset>
      <p class="err" id="err-pred" role="alert" hidden data-i18n="game.need"></p>
      <p class="note" data-i18n="game.robotNote"></p>
    </div>
    <div class="dlg-foot">
      <div class="spacer"></div>
      <button type="button" class="btn" data-close data-i18n="ui.cancel"></button>
      <button type="submit" class="btn btn-primary btn-lg"><svg class="ic" aria-hidden="true"><use href="#u-check"/></svg><span data-i18n="game.lock"></span></button>
    </div>
  </form>
</dialog>

<!-- ═════════ REWARD DIALOG ═════════ -->
<dialog id="dlg-reward" aria-labelledby="reward-title">
  <div class="dlg-body reward" id="reward-body">
    <svg class="reward-mascot" id="reward-mascot" aria-hidden="true"><use href="#m-wow"/></svg>
    <h2 id="reward-title" class="reward-title"></h2>
    <div id="reward-content"></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
  </div>
  <div class="dlg-foot center">
    <button type="button" class="btn btn-cta2" id="reward-predict" hidden><svg class="ic" aria-hidden="true"><use href="#robot"/></svg><span data-i18n="game.cta"></span></button>
    <button type="button" class="btn btn-primary btn-lg" id="reward-ok" data-close><svg class="ic" aria-hidden="true"><use href="#u-check"/></svg><span data-i18n="ui.done"></span></button>
  </div>
</dialog>

<!-- ═════════ PLACE ═════════ -->
<dialog id="dlg-place" aria-labelledby="place-title">
  <form id="place-form" novalidate>
    <div class="dlg-head">
      <h2 class="dlg-title" id="place-title" data-i18n="place.title"></h2>
      <button type="button" class="btn btn-icon btn-ghost" data-close data-i18n-attr="aria-label:ui.close"><svg class="ic" aria-hidden="true"><use href="#u-close"/></svg></button>
    </div>
    <div class="dlg-body">
      <div class="field">
        <label for="place-q" data-i18n="place.label"></label>
        <div class="row">
          <input type="search" id="place-q" autocomplete="off" enterkeyhint="search">
          <button type="submit" class="btn btn-primary"><svg class="ic" aria-hidden="true"><use href="#u-search"/></svg><span data-i18n="place.search"></span></button>
        </div>
      </div>
      <button type="button" class="btn btn-sm" id="btn-geo"><svg class="ic" aria-hidden="true"><use href="#u-pin"/></svg><span data-i18n="place.geo"></span></button>
      <p class="hint" id="place-status" role="status"></p>
      <ul class="results" id="place-results"></ul>
      <p class="note" data-i18n="place.privacy"></p>
    </div>
  </form>
</dialog>

<!-- ═════════ PROFILES ═════════ -->
<dialog id="dlg-profile" class="wide" aria-labelledby="profile-title">
  <div class="dlg-head">
    <h2 class="dlg-title" id="profile-title" data-i18n="profile.title"></h2>
    <button type="button" class="btn btn-icon btn-ghost" data-close data-i18n-attr="aria-label:ui.close"><svg class="ic" aria-hidden="true"><use href="#u-close"/></svg></button>
  </div>
  <div class="dlg-body">
    <p class="hint" data-i18n="profile.hint"></p>
    <ul class="profiles" id="profile-list"></ul>
    <div class="row-actions"><button type="button" class="btn btn-primary" id="btn-profile-new"><svg class="ic" aria-hidden="true"><use href="#u-plus"/></svg><span data-i18n="profile.new"></span></button></div>

    <form id="profile-form" class="subform" hidden novalidate>
      <h3 id="profile-form-title"></h3>
      <div class="row">
        <div class="field"><label for="p-name" data-i18n="profile.name"></label><input type="text" id="p-name" maxlength="40" autocomplete="off"></div>
        <div class="field"><label for="p-class" data-i18n="profile.class"></label><input type="text" id="p-class" maxlength="10" autocomplete="off"></div>
      </div>
      <fieldset class="field">
        <legend data-i18n="profile.avatar"></legend>
        <div class="avatar-grid" id="avatar-chips" role="group" data-i18n-attr="aria-label:profile.avatar"></div>
      </fieldset>
      <div class="field">
        <label for="p-pin" data-i18n="pin.label"></label>
        <input type="password" id="p-pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
        <p class="hint" id="p-pin-hint" data-i18n="pin.hint"></p>
      </div>
      <div class="row-actions">
        <button type="button" class="btn btn-danger" id="btn-profile-delete" hidden><svg class="ic" aria-hidden="true"><use href="#u-trash"/></svg><span data-i18n="profile.delete"></span></button>
        <div class="spacer"></div>
        <button type="button" class="btn" id="btn-profile-cancel" data-i18n="ui.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="profile.save"></button>
      </div>
    </form>
  </div>
</dialog>

<!-- ═════════ SETTINGS ═════════ -->
<dialog id="dlg-settings" aria-labelledby="settings-title">
  <div class="dlg-head">
    <h2 class="dlg-title" id="settings-title" data-i18n="settings.title"></h2>
    <button type="button" class="btn btn-icon btn-ghost" data-close data-i18n-attr="aria-label:ui.close"><svg class="ic" aria-hidden="true"><use href="#u-close"/></svg></button>
  </div>
  <div class="dlg-body">
    <div class="settings-group">
      <h3 data-i18n="set.mode"></h3>
      <div class="switch-row"><input type="checkbox" id="set-kid"><label for="set-kid"><strong data-i18n="set.kid"></strong><small data-i18n="set.kid.hint"></small></label></div>
      <div class="switch-row" id="row-speak"><input type="checkbox" id="set-speak"><label for="set-speak"><strong data-i18n="set.speak"></strong><small data-i18n="set.speak.hint"></small></label></div>
    </div>
    <div class="settings-group">
      <h3 data-i18n="set.units"></h3>
      <div class="seg" role="group" data-i18n-attr="aria-label:set.units">
        <label><input type="radio" name="units" value="metric"><span data-i18n="set.metric"></span></label>
        <label><input type="radio" name="units" value="imperial"><span data-i18n="set.imperial"></span></label>
      </div>
    </div>
    <div class="settings-group">
      <h3 data-i18n="set.a11y"></h3>
      <div class="switch-row"><input type="checkbox" id="set-hc"><label for="set-hc"><strong data-i18n="set.contrast"></strong></label></div>
      <div class="switch-row"><input type="checkbox" id="set-large"><label for="set-large"><strong data-i18n="set.large"></strong></label></div>
      <div class="switch-row"><input type="checkbox" id="set-readable"><label for="set-readable"><strong data-i18n="set.readable"></strong><small data-i18n="set.readable.hint"></small></label></div>
      <div class="switch-row"><input type="checkbox" id="set-hideChart"><label for="set-hideChart"><strong data-i18n="set.hideChart"></strong><small data-i18n="set.hideChart.hint"></small></label></div>
    </div>
    <div class="settings-group">
      <h3 data-i18n="set.data"></h3>
      <button type="button" class="btn btn-block" id="btn-install" hidden><svg class="ic" aria-hidden="true"><use href="#u-install"/></svg><span data-i18n="set.install"></span></button>
      <button type="button" class="btn btn-danger btn-block" id="btn-wipe"><svg class="ic" aria-hidden="true"><use href="#u-trash"/></svg><span data-i18n="set.wipe"></span></button>
    </div>
  </div>
</dialog>

<!-- ═════════ CONFIRM / GATE / PIN / PRIVACY / CLASS ═════════ -->
<dialog id="dlg-confirm" aria-labelledby="confirm-title">
  <div class="dlg-head"><h2 class="dlg-title" id="confirm-title"></h2></div>
  <div class="dlg-body"><p id="confirm-text"></p></div>
  <div class="dlg-foot">
    <div class="spacer"></div>
    <button type="button" class="btn" id="confirm-cancel" data-i18n="ui.cancel"></button>
    <button type="button" class="btn btn-danger" id="confirm-ok" data-i18n="ui.ok"></button>
  </div>
</dialog>

<dialog id="dlg-gate" aria-labelledby="gate-title">
  <form id="gate-form" novalidate>
    <div class="dlg-head"><svg class="ic ic-lg" aria-hidden="true"><use href="#u-lock"/></svg><h2 class="dlg-title" id="gate-title" data-i18n="gate.title"></h2></div>
    <div class="dlg-body">
      <p id="gate-text" class="hint"></p>
      <div class="field">
        <label for="gate-a" id="gate-q"></label>
        <input type="text" id="gate-a" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
        <p class="err" id="gate-err" role="alert" hidden data-i18n="gate.wrong"></p>
      </div>
    </div>
    <div class="dlg-foot"><div class="spacer"></div>
      <button type="button" class="btn" id="gate-cancel" data-i18n="ui.cancel"></button>
      <button type="submit" class="btn btn-primary" data-i18n="ui.ok2"></button>
    </div>
  </form>
</dialog>

<dialog id="dlg-pin" aria-labelledby="pin-title">
  <form id="pin-form" novalidate>
    <div class="dlg-head"><svg class="ic ic-lg" aria-hidden="true"><use href="#u-lock"/></svg><h2 class="dlg-title" id="pin-title"></h2></div>
    <div class="dlg-body">
      <div class="field">
        <label for="pin-a" data-i18n="pin.enter"></label>
        <input type="password" id="pin-a" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
        <p class="err" id="pin-err" role="alert" hidden data-i18n="pin.wrong"></p>
      </div>
      <button type="button" class="btn btn-sm btn-ghost" id="pin-forgot" data-i18n="pin.forgot"></button>
    </div>
    <div class="dlg-foot"><div class="spacer"></div>
      <button type="button" class="btn" id="pin-cancel" data-i18n="ui.cancel"></button>
      <button type="submit" class="btn btn-primary" data-i18n="ui.ok2"></button>
    </div>
  </form>
</dialog>

<dialog id="dlg-privacy" aria-labelledby="privacy-title">
  <div class="dlg-head">
    <h2 class="dlg-title" id="privacy-title" data-i18n="privacy.title"></h2>
    <button type="button" class="btn btn-icon btn-ghost" data-close data-i18n-attr="aria-label:ui.close"><svg class="ic" aria-hidden="true"><use href="#u-close"/></svg></button>
  </div>
  <div class="dlg-body privacy">
    <p data-i18n="privacy.local"></p>
    <p data-i18n="privacy.network"></p>
    <p data-i18n="privacy.children"></p>
    <p data-i18n="privacy.pin"></p>
    <p data-i18n="privacy.credits"></p>
  </div>
</dialog>

<dialog id="dlg-class" class="wide" aria-labelledby="class-title">
  <div class="dlg-head">
    <h2 class="dlg-title" id="class-title" data-i18n="class.title"></h2>
    <button type="button" class="btn btn-icon btn-ghost" data-close data-i18n-attr="aria-label:ui.close"><svg class="ic" aria-hidden="true"><use href="#u-close"/></svg></button>
  </div>
  <div class="dlg-body" id="class-body"></div>
</dialog>

<div id="scrim" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<section id="print-report" aria-hidden="true"></section>
</body>
</html>
